name: Final Layer
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Install dependencies
        run: |
          npm install
          forge install --no-git foundry-rs/forge-std@v1.7.3
      - name: Final Layer tests
        run: forge test --match-path 'test/FinalLayer*.t.sol'
